<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1255aa"><title>英文法トレーナー Ver.1</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#19324f;background:#edf5ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#0a438e,#2385da);color:white;padding:24px 18px;box-shadow:0 4px 18px #123c7b22}header .wrap{max-width:960px;margin:auto}h1{font-size:clamp(23px,4vw,34px);margin:0 0 7px}header p{margin:0;opacity:.9}.wrap{max-width:960px;margin:24px auto;padding:0 15px}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 7px 24px #17497c16;margin-bottom:18px}h2{margin:0 0 18px;color:#104d9b;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{margin-bottom:17px}.field label{display:block;font-weight:700;margin-bottom:8px}select,.btn{font:inherit;border-radius:11px;padding:12px;border:1px solid #b7cde6;background:white;color:#19324f;min-height:46px}select{width:100%}.btn{cursor:pointer;font-weight:700}.primary{background:#1261ba;color:white;border:0}.secondary{background:#e9f3ff;color:#1554a0;border:1px solid #b7d6f6}.btn:disabled{opacity:.5;cursor:not-allowed}.btn:hover:not(:disabled){filter:brightness(.96)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#61758c;font-size:14px}.hidden{display:none!important}.pill{display:inline-block;background:#e3f0ff;color:#1658a8;padding:5px 11px;border-radius:100px;font-weight:700;font-size:13px}.prompt{font-size:17px;font-weight:700;margin:14px 0 18px}.sentence{display:flex;flex-wrap:wrap;align-items:center;gap:7px;line-height:2.7;margin:12px 0 18px}.word{font-size:19px}.slot{min-width:64px;min-height:45px;padding:5px 12px;border:2px dashed #82b2e9;border-radius:9px;background:#f1f8ff;color:#164d92;font-size:18px;font-weight:700}.slot.filled{background:#dceeff;border-style:solid}.choices{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 18px}.choice{padding:10px 16px;background:#f5faff;border:1px solid #94bce7;color:#154f96;border-radius:10px;min-height:45px;font-size:17px;font-weight:650;cursor:pointer}.choice.used{opacity:.28;cursor:default}.question{padding:18px;border:1px solid #d7e6f5;border-radius:14px;margin-bottom:14px;background:#fff}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.feedback{margin-top:14px;border-radius:11px;padding:14px;background:#eff7ff;line-height:1.8}.feedback.good{background:#e8f8ed;color:#16643c}.feedback.bad{background:#fff0ec;color:#8d3328}.score{font-size:40px;font-weight:800;color:#145aaf;margin:10px 0}.result-item{padding:14px 0;border-bottom:1px solid #e0eaf5}.result-item:last-child{border:0}.sticky{position:sticky;bottom:0;background:#edf5ffed;padding:12px 0;border-top:1px solid #c9dcf1}.notice{border-left:4px solid #2684ce;padding:8px 12px;background:#f0f8ff;font-size:14px}.spacer{height:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:17px}.question{padding:13px}.slot{min-width:55px;padding:4px 8px}.choice{padding:9px 12px}}
</style></head><body><header><div class="wrap"><h1>📘 英文法トレーナー <small style="font-size:14px;opacity:.8">Ver.1</small></h1><p>単語を選んで英文を完成させよう</p></div></header><main class="wrap"><section id="setup" class="panel"><h2>学習設定</h2><div class="grid"><div class="field"><label for="mode">学習モード</label><select id="mode"><option value="practice">一問一答（すぐに答え合わせ）</option><option value="test">テスト（最後にまとめて採点）</option></select></div><div class="field"><label for="difficulty">難易度</label><select id="difficulty"><option value="easy">初級：空欄1〜2個</option><option value="medium">中級：空欄2〜4個</option><option value="hard">上級：英文をすべて並べ替え</option></select></div><div class="field"><label for="count">問題数</label><select id="count"><option value="10">10問</option><option value="20">20問</option><option value="30">30問</option></select></div><div class="field"><label for="category">出題範囲</label><select id="category"><option value="all">すべての文法</option><option value="be">be動詞</option><option value="verb">一般動詞・三人称単数</option><option value="can">can</option><option value="negative">否定文</option><option value="question">疑問文</option><option value="imperative">命令文</option></select></div></div><p class="notice">30の例文を収録。指定した範囲の問題が不足する場合は、同じ例文を別の空欄パターンで再出題します。</p><button class="btn primary" id="start">学習を開始する →</button></section><section id="session" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><div><span class="pill" id="modeLabel"></span> <span class="pill" id="levelLabel"></span></div><span id="progress" class="muted"></span></div><h2 style="margin-top:15px" id="sessionTitle"></h2><div id="questions"></div><div class="sticky"><div class="row"><button id="submit" class="btn primary">回答を確定</button><button id="next" class="btn primary hidden">次の問題 →</button><button id="finish" class="btn primary hidden">まとめて採点する</button><button id="quit" class="btn secondary">設定に戻る</button></div></div></div></section><section id="results" class="panel hidden"><h2>学習結果</h2><div class="score" id="score"></div><p id="scoreSub"></p><div id="review"></div><div class="row" style="margin-top:18px"><button class="btn primary" id="retry">同じ設定でもう一度</button><button class="btn secondary" id="home">設定に戻る</button></div></section></main><script>
'use strict';
// Each example is manually reviewed; distractors are curated per sentence.
const RAW=[
['彼は先生です。','He is a teacher.','be','be動詞 is は主語が he のときに使います。','are','am'],
['私は学生です。','I am a student.','be','I に対応する be動詞は am です。','is','are'],
['彼らは親切です。','They are kind.','be','They に対応する be動詞は are です。','is','am'],
['これは私の本です。','This is my book.','be','This は単数なので is を使います。','are','am'],
['私たちは幸せです。','We are happy.','be','We に対応する be動詞は are です。','is','am'],
['私は毎日英語を勉強します。','I study English every day.','verb','I が主語の現在形では study を使います。','studies','studying'],
['彼女は毎日テニスをします。','She plays tennis every day.','verb','三人称単数現在のため play に s が付きます。','play','playing'],
['彼は学校へ歩いて行きます。','He walks to school.','verb','He が主語の現在形では walks になります。','walk','walking'],
['彼女は音楽が好きです。','She likes music.','verb','She が主語の現在形では likes を使います。','like','liking'],
['私たちは放課後サッカーをします。','We play soccer after school.','verb','We が主語なので play を使います。','plays','playing'],
['私は泳ぐことができます。','I can swim.','can','can の後には動詞の原形 swim を置きます。','swims','swimming'],
['彼女はピアノを弾くことができます。','She can play the piano.','can','can の後には三人称単数でも原形 play を使います。','plays','playing'],
['彼らは英語を話すことができます。','They can speak English.','can','can の後には動詞の原形を使います。','speaks','speaking'],
['あなたは速く走ることができます。','You can run fast.','can','can の後には動詞の原形 run を置きます。','runs','running'],
['彼は上手に歌うことができます。','He can sing well.','can','can の後には動詞の原形 sing を置きます。','sings','singing'],
['私はコーヒーが好きではありません。','I do not like coffee.','negative','一般動詞の否定文は do not ＋動詞の原形です。','does','likes'],
['彼女は野球をしません。','She does not play baseball.','negative','三人称単数の否定文では does not の後に原形 play を置きます。','do','plays'],
['彼らは忙しくありません。','They are not busy.','negative','be動詞の否定文では be動詞の後に not を置きます。','is','do'],
['私は疲れていません。','I am not tired.','negative','I am not の語順になります。','is','do'],
['彼は犬が好きではありません。','He does not like dogs.','negative','does not の後は likes ではなく like です。','do','likes'],
['あなたは英語が好きですか。','Do you like English?','question','一般動詞の疑問文では Do を文頭に置きます。','Does','Are'],
['彼女は毎日走りますか。','Does she run every day?','question','三人称単数の疑問文は Does ＋主語＋動詞の原形です。','Do','runs'],
['彼は学生ですか。','Is he a student?','question','be動詞の疑問文は Is を主語の前に置きます。','Are','Does'],
['あなたは泳げますか。','Can you swim?','question','can の疑問文は Can ＋主語＋動詞の原形です。','Do','swims'],
['彼らはあなたの友達ですか。','Are they your friends?','question','They に対応する be動詞は are です。','Is','Do'],
['ドアを開けてください。','Open the door, please.','imperative','命令文は動詞の原形 Open で始めます。','Opens','Opening'],
['ここに座ってください。','Sit down here, please.','imperative','命令文は動詞の原形 Sit で始めます。','Sits','Sitting'],
['静かにしてください。','Be quiet, please.','imperative','形容詞 quiet を使う命令文は Be で始めます。','Is','Are'],
['走らないでください。','Do not run, please.','imperative','否定の命令文は Do not ＋動詞の原形です。','Does','runs'],
['この本を読んでください。','Read this book, please.','imperative','命令文は動詞の原形 Read で始めます。','Reads','Reading']
];
function tokenize(s){return s.match(/[A-Za-z]+|[.,?!]/g)||[]}
const DB=RAW.map((r,id)=>({id,jp:r[0],en:r[1],category:r[2],explanation:r[3],distractors:r.slice(4),tokens:tokenize(r[1])}));
const $=id=>document.getElementById(id);let state=null;
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function generate(item,level){let indices=item.tokens.map((t,i)=>/^[A-Za-z]+$/.test(t)?i:-1).filter(i=>i>=0);let blanks;if(level==='hard'){blanks=indices}else{let n=level==='easy'?Math.min(indices.length,1+Math.floor(Math.random()*2)):Math.min(indices.length,Math.max(2,Math.min(4,Math.ceil(indices.length*.65))));blanks=shuffle(indices).slice(0,n).sort((a,b)=>a-b)}
const answers=blanks.map(i=>item.tokens[i]);let extras=[];const candidates=[...item.distractors,...shuffle(DB.filter(x=>x.id!==item.id).flatMap(x=>x.tokens.filter(t=>/^[A-Za-z]+$/.test(t))))];const forbidden=new Set(item.tokens.map(t=>t.toLowerCase()));for(const w of candidates){if(!forbidden.has(w.toLowerCase())&&!extras.some(x=>x.toLowerCase()===w.toLowerCase()))extras.push(w);if(extras.length>= (level==='easy'?3:level==='medium'?3:4))break}
let tiles=shuffle([...answers,...extras]).map((word,i)=>({id:i,word}));return {item,blanks,tiles,filled:[],graded:false};}
function setView(name){['setup','session','results'].forEach(id=>$(id).classList.toggle('hidden',id!==name));window.scrollTo({top:0,behavior:'instant'})}
function start(){const mode=$('mode').value,level=$('difficulty').value,count=Number($('count').value),category=$('category').value;let pool=DB.filter(x=>category==='all'||x.category===category);if(!pool.length)return;let selected=[];while(selected.length<count){selected.push(...shuffle(pool).slice(0,count-selected.length))}state={mode,level,count,category,questions:selected.map(x=>generate(x,level)),index:0};$('modeLabel').textContent=mode==='practice'?'一問一答':'テスト';$('levelLabel').textContent={easy:'初級',medium:'中級',hard:'上級'}[level];$('sessionTitle').textContent=mode==='practice'?'1問ずつ答え合わせ':'すべて回答してから採点';$('submit').classList.toggle('hidden',mode!=='practice');$('finish').classList.toggle('hidden',mode!=='test');$('next').classList.add('hidden');render();setView('session')}
function renderQuestion(q,i){const isTest=state.mode==='test';const used=new Set(q.filled);const blankMap=new Map(q.blanks.map((pos,j)=>[pos,j]));let sentence=q.item.tokens.map((tok,pos)=>{if(!blankMap.has(pos))return `<span class="word">${escapeHTML(tok)}</span>`;let k=blankMap.get(pos),tid=q.filled[k],tile=q.tiles.find(t=>t.id===tid);return `<button class="slot ${tile?'filled':''}" data-action="remove" data-q="${i}" data-slot="${k}" ${q.graded?'disabled':''} aria-label="空欄${k+1}${tile?' '+escapeHTML(tile.word):''}">${tile?escapeHTML(tile.word):'□'}</button>`}).join(' ');
const choices=q.tiles.map(t=>`<button class="choice ${used.has(t.id)?'used':''}" data-action="add" data-q="${i}" data-tile="${t.id}" ${used.has(t.id)||q.graded?'disabled':''}>${escapeHTML(t.word)}</button>`).join('');let fb='';if(q.graded){let ok=isCorrect(q);fb=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'正解！':'不正解'}</b><br>正しい英文：${escapeHTML(q.item.en)}<br>${escapeHTML(q.item.explanation)}</div>`}
return `<article class="question"><div class="qhead"><strong>第${i+1}問</strong><span class="pill">${q.filled.length}/${q.blanks.length} 空欄</span></div><p class="prompt">${escapeHTML(q.item.jp)}</p><div class="sentence">${sentence}</div><div class="choices">${choices}</div><div class="row"><button class="btn secondary" data-action="undo" data-q="${i}" ${!q.filled.length||q.graded?'disabled':''}>1つ戻す</button><button class="btn secondary" data-action="clear" data-q="${i}" ${!q.filled.length||q.graded?'disabled':''}>やり直す</button></div>${fb}</article>`}
function render(){const test=state.mode==='test';$('progress').textContent=test?`全${state.count}問 / 回答済み ${state.questions.filter(q=>q.filled.length===q.blanks.length).length}問`:`${state.index+1} / ${state.count}問`;$('questions').innerHTML=test?state.questions.map(renderQuestion).join(''):renderQuestion(state.questions[state.index],state.index);if(!test){let q=state.questions[state.index];$('submit').disabled=q.filled.length!==q.blanks.length||q.graded;$('submit').classList.toggle('hidden',q.graded);$('next').classList.toggle('hidden',!q.graded);$('next').textContent=state.index===state.count-1?'結果を見る':'次の問題 →'}}
function isCorrect(q){return q.filled.length===q.blanks.length&&q.filled.every((id,j)=>q.tiles.find(t=>t.id===id)?.word===q.item.tokens[q.blanks[j]])}
$('questions').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||!state)return;let i=Number(b.dataset.q),q=state.questions[i];if(q.graded)return;switch(b.dataset.action){case 'add':if(q.filled.length<q.blanks.length&&!q.filled.includes(Number(b.dataset.tile)))q.filled.push(Number(b.dataset.tile));break;case 'remove':{let k=Number(b.dataset.slot);if(k<q.filled.length)q.filled.splice(k);break}case 'undo':q.filled.pop();break;case 'clear':q.filled=[];break}const sy=window.scrollY;render();window.scrollTo(0,sy)});
$('start').onclick=start;$('submit').onclick=()=>{let q=state.questions[state.index];if(q.filled.length!==q.blanks.length)return;q.graded=true;render()};$('next').onclick=()=>{if(state.index===state.count-1)showResults();else{state.index++;render();window.scrollTo({top:0,behavior:'instant'})}};$('finish').onclick=()=>{let incomplete=state.questions.filter(q=>q.filled.length!==q.blanks.length).length;if(incomplete&&!confirm(`${incomplete}問が未回答です。未回答の問題は不正解として採点しますか？`))return;showResults()};$('quit').onclick=()=>{if(confirm('学習を終了して設定に戻りますか？'))setView('setup')};$('home').onclick=()=>setView('setup');$('retry').onclick=start;
function showResults(){let correct=state.questions.filter(isCorrect).length;$('score').textContent=`${correct} / ${state.count} 問正解`;$('scoreSub').textContent=`正答率 ${Math.round(correct/state.count*100)}%`;let html='<h2>答え合わせ</h2>';state.questions.forEach((q,i)=>{const ans=q.filled.map(id=>q.tiles.find(t=>t.id===id)?.word||'').join(' / ');html+=`<div class="result-item"><b>第${i+1}問 ${isCorrect(q)?'✓ 正解':'✕ 不正解'}</b><p>${escapeHTML(q.item.jp)}</p><div class="muted">選択した単語：${escapeHTML(ans||'未回答')}</div><div><b>正解：</b>${escapeHTML(q.item.en)}</div><div class="muted">${escapeHTML(q.item.explanation)}</div></div>`});$('review').innerHTML=html;setView('results')}
</script></body></html>
