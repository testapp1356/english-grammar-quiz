function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function generate(item,level){
 const indices=item.tokens.map((t,i)=>/^[A-Za-z]+$/.test(t)?i:-1).filter(i=>i>=0);
 let blanks;
 if(level==='hard'){blanks=indices;}
 else if(level==='easy'){
   const targets=item.targets||[];const chosen=[];
   const grammar=targets[0];const pronouns=new Set(['i','my','me','mine','you','your','yours','he','him','his','she','her','hers','it','its','we','our','us','ours','they','their','them','theirs']);
   const findTarget=(t)=>indices.find(i=>item.tokens[i].toLowerCase()===t.toLowerCase()&&!chosen.includes(i));
   let gi=findTarget(grammar);if(gi!==undefined)chosen.push(gi);
   const pronounTarget=targets.slice(1).find(t=>pronouns.has(t.toLowerCase())&&findTarget(t)!==undefined);
   if(pronounTarget){let pi=findTarget(pronounTarget);if(pi!==undefined)chosen.push(pi)}
   blanks=chosen.sort((a,b)=>a-b);
 }else{
   const targetPositions=indices.filter(i=>(item.targets||[]).some(t=>t.toLowerCase()===item.tokens[i].toLowerCase()));
   const n=Math.min(indices.length,Math.max(2,Math.min(4,Math.ceil(indices.length*.65))));
   blanks=[...new Set([...targetPositions,...shuffle(indices)])].slice(0,n).sort((a,b)=>a-b);
 }
 const answers=blanks.map(i=>item.tokens[i]);
 const forbidden=new Set(item.tokens.map(t=>t.toLowerCase()));
 const generic=['am','is','are','do','does','can','cannot','not','play','plays','played','playing','study','studies','studied','have','has','go','goes','went','read','reads','like','likes'];
 const forms=['i','my','me','mine','you','your','yours','he','him','his','she','her','hers','it','its','we','our','us','ours','they','their','them','theirs'];const candidates=[...shuffle(item.distractors),...shuffle(forms),...shuffle(generic)];
 const extras=[];
 for(const w of candidates){if(!forbidden.has(w.toLowerCase())&&!extras.some(x=>x.toLowerCase()===w.toLowerCase()))extras.push(w);if(extras.length>=(level==='easy'?4:level==='medium'?4:5))break}
 const tiles=shuffle([...answers,...extras]).map((word,i)=>({id:i,word:word.toLowerCase()}));
 return {item,blanks,tiles,filled:[],graded:false};
}
function setView(name){['setup','session','results'].forEach(id=>$(id).classList.toggle('hidden',id!==name));window.scrollTo({top:0,behavior:'instant'})}
function start(){const mode=$('mode').value,level=$('difficulty').value,count=Number($('count').value),category=$('category').value;let pool=DB.filter(x=>category==='all'||x.category===category);if(!pool.length)return;let selected=[];while(selected.length<count){selected.push(...shuffle(pool).slice(0,count-selected.length))}state={mode,level,count,category,questions:selected.map(x=>generate(x,level)),index:0};$('modeLabel').textContent=mode==='practice'?'一問一答':'テスト';$('levelLabel').textContent={easy:'初級',medium:'中級',hard:'上級'}[level];$('sessionTitle').textContent=mode==='practice'?'1問ずつ答え合わせ':'すべて回答してから採点';$('submit').classList.toggle('hidden',mode!=='practice');$('finish').classList.toggle('hidden',mode!=='test');$('next').classList.add('hidden');render();setView('session')}
function renderQuestion(q,i){const isTest=state.mode==='test';const used=new Set(q.filled);const blankMap=new Map(q.blanks.map((pos,j)=>[pos,j]));let sentence=q.item.tokens.map((tok,pos)=>{if(!blankMap.has(pos))return `<span class="word">${escapeHTML(tok)}</span>`;let k=blankMap.get(pos),tid=q.filled[k],tile=q.tiles.find(t=>t.id===tid);return `<button class="slot ${tile?'filled':''}" data-action="remove" data-q="${i}" data-slot="${k}" ${q.graded?'disabled':''} aria-label="空欄${k+1}${tile?' '+escapeHTML(tile.word):''}">${tile?escapeHTML(tile.word):'□'}</button>`}).join(' ');
const choices=q.tiles.map(t=>`<button class="choice ${used.has(t.id)?'used':''}" data-action="add" data-q="${i}" data-tile="${t.id}" ${used.has(t.id)||q.graded?'disabled':''}>${escapeHTML(t.word)}</button>`).join('');let fb='';if(q.graded){let ok=isCorrect(q);fb=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'正解！':'不正解'}</b><br>正しい英文：${escapeHTML(q.item.en)}<br>${escapeHTML(q.item.explanation)}</div>`}
return `<article class="question"><div class="qhead"><strong>第${i+1}問</strong><span class="pill">${q.filled.length}/${q.blanks.length} 空欄</span></div><p class="prompt">${escapeHTML(q.item.jp)}</p><div class="sentence">${sentence}</div><div class="choices">${choices}</div><div class="row"><button class="btn secondary" data-action="undo" data-q="${i}" ${!q.filled.length||q.graded?'disabled':''}>1つ戻す</button><button class="btn secondary" data-action="clear" data-q="${i}" ${!q.filled.length||q.graded?'disabled':''}>やり直す</button></div>${fb}</article>`}
function render(){const test=state.mode==='test';$('progress').textContent=test?`全${state.count}問 / 回答済み ${state.questions.filter(q=>q.filled.length===q.blanks.length).length}問`:`${state.index+1} / ${state.count}問`;$('questions').innerHTML=test?state.questions.map(renderQuestion).join(''):renderQuestion(state.questions[state.index],state.index);if(!test){let q=state.questions[state.index];$('submit').disabled=q.filled.length!==q.blanks.length||q.graded;$('submit').classList.toggle('hidden',q.graded);$('next').classList.toggle('hidden',!q.graded);$('next').textContent=state.index===state.count-1?'結果を見る':'次の問題 →'}}
function isCorrect(q){return q.filled.length===q.blanks.length&&q.filled.every((id,j)=>q.tiles.find(t=>t.id===id)?.word.toLowerCase()===q.item.tokens[q.blanks[j]].toLowerCase())}
$('questions').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||!state)return;let i=Number(b.dataset.q),q=state.questions[i];if(q.graded)return;switch(b.dataset.action){case 'add':if(q.filled.length<q.blanks.length&&!q.filled.includes(Number(b.dataset.tile)))q.filled.push(Number(b.dataset.tile));break;case 'remove':{let k=Number(b.dataset.slot);if(k<q.filled.length)q.filled.splice(k);break}case 'undo':q.filled.pop();break;case 'clear':q.filled=[];break}const sy=window.scrollY;render();window.scrollTo(0,sy)});
$('start').onclick=start;$('submit').onclick=()=>{let q=state.questions[state.index];if(q.filled.length!==q.blanks.length)return;q.graded=true;render()};$('next').onclick=()=>{if(state.index===state.count-1)showResults();else{state.index++;render();window.scrollTo({top:0,behavior:'instant'})}};$('finish').onclick=()=>{let incomplete=state.questions.filter(q=>q.filled.length!==q.blanks.length).length;if(incomplete&&!confirm(`${incomplete}問が未回答です。未回答の問題は不正解として採点しますか？`))return;showResults()};$('quit').onclick=()=>{if(confirm('学習を終了して設定に戻りますか？'))setView('setup')};$('home').onclick=()=>setView('setup');$('retry').onclick=start;
function showResults(){let correct=state.questions.filter(isCorrect).length;$('score').textContent=`${correct} / ${state.count} 問正解`;$('scoreSub').textContent=`正答率 ${Math.round(correct/state.count*100)}%`;let html='<h2>答え合わせ</h2>';state.questions.forEach((q,i)=>{const ans=q.filled.map(id=>q.tiles.find(t=>t.id===id)?.word||'').join(' / ');html+=`<div class="result-item"><b>第${i+1}問 ${isCorrect(q)?'✓ 正解':'✕ 不正解'}</b><p>${escapeHTML(q.item.jp)}</p><div class="muted">選択した単語：${escapeHTML(ans||'未回答')}</div><div><b>正解：</b>${escapeHTML(q.item.en)}</div><div class="muted">${escapeHTML(q.item.explanation)}</div></div>`});$('review').innerHTML=html;setView('results')}
</script></body></html>
